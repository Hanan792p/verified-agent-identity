name: hanan febrian

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Step 2 - Identity Verification
        run: |
          echo "Verifying identity for Hanan Febrian (bourak)"
          echo "Process started..."
          sleep 5
          echo "Verification Complete!"

      - name: Step 3 - Link Human to Agent
        run: |
          echo "Link generated: https://billions.network/verify-agent?user=hanan-febrian"
          echo "Please check the log for the binding link below."
